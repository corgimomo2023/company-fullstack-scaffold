name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: backend/requirements-dev.lock}
      - run: pip install -r requirements-dev.lock
      - run: ruff format --check . && ruff check .
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing
      - run: pip-audit -r requirements.lock
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: npm audit --audit-level=high
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pytest
      - run: pytest tests/test_scaffold.py -q
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: docker compose config --quiet
      - run: docker compose up -d --build
      - name: Wait for production entrypoint
        run: |
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8080/api/v1/health/ready
          test "$(docker compose ps --status running --services | wc -l)" -eq 2
          docker compose ps --status running
      - name: Verify production security headers
        run: |
          headers="$(curl --fail --silent --show-error --head http://127.0.0.1:8080/)"
          grep -iq '^X-Content-Type-Options: nosniff' <<<"$headers"
          grep -iq '^Referrer-Policy: strict-origin-when-cross-origin' <<<"$headers"
          grep -iq '^Permissions-Policy:' <<<"$headers"
      - run: npm run e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
