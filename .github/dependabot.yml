version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    groups: {frontend-minor-patch: {update-types: [minor, patch]}}
  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
